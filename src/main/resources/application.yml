#########################################
# SERIAL / MODBUS CONFIGURATION
#########################################
serial:
  input:
    port: ${SERIAL_INPUT_PORT:COM6}
    baudRate: ${SERIAL_INPUT_BAUD:9600}
    slaveId: ${SERIAL_INPUT_SLAVE:1}

    # Polling interval in ms (1 second recommended for SDM630)
    pollInterval: ${SERIAL_INPUT_POLL:1000}

    # Startup delay after reboot / USB reconnect
    initialOpenDelayMs: ${SERIAL_INITIAL_OPEN_DELAY_MS:2000}

    # Retry behavior
    reopenBackoffMs: ${SERIAL_REOPEN_BACKOFF_MS:2000}
    warmupMs: ${SERIAL_WARMUP_MS:2000}
    timeoutsBeforeReopen: ${SERIAL_TIMEOUTS_BEFORE_REOPEN:3}

#########################################
# CSV STORAGE
#########################################
storage:
  csv:
    # Folder where CSV files will be written.
    # Default: "data" inside current working dir.
    path: ${CSV_PATH:data}

#########################################
# SDM630 REGISTER MAP
#########################################
meterMap:
  # Voltages
  vL1: 0
  vL2: 2
  vL3: 4

  # Currents
  iL1: 6
  iL2: 8
  iL3: 10

  # Active Power (W)
  pL1: 12
  pL2: 14
  pL3: 16
  pTotal: 18

  # Reactive Power (VAr)
  qL1: 20
  qL2: 22
  qL3: 24
  qTotal: 26

  # Apparent Power (VA)
  sL1: 28
  sL2: 30
  sL3: 32
  sTotal: 34

  # Power Factor
  pfL1: 36
  pfL2: 38
  pfL3: 40
  pfTotal: 42

  # Frequency
  frequency: 70

  # Energy (not in first block — need additional request!)
  kwhImportL1: 256
  kwhImportL2: 258
  kwhImportL3: 260
  kwhImportTotal: 262

  kvarhImportL1: 266
  kvarhImportL2: 268
  kvarhImportL3: 270
  kvarhImportTotal: 272

#########################################
# ACTUATOR & MANAGEMENT
#########################################
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: "/_manage"

#########################################
# LOGGING
#########################################
logging:
  level:
    root: INFO
    com.factorygridmonitor: INFO

#########################################
# SPRING SERVER
#########################################
server:
  port: ${SERVER_PORT:8888}
  address: ${SERVER_ADDRESS:0.0.0.0}
